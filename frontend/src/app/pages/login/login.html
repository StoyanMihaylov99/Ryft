<div class="page">
<div class="card">
  <div class="brand">
    <img src="logo-full.png" alt="Ryft" class="brand-logo" width="173" height="60" />
  </div>

  @if (errorMessage()) {
    <div class="banner" role="alert">{{ errorMessage() }}</div>
  }

  <div class="tabs">
    <button
      type="button"
      [class.active]="mode() === 'login'"
      [attr.aria-pressed]="mode() === 'login'"
      (click)="switchMode('login')"
    >
      Log in
    </button>
    <button
      type="button"
      [class.active]="mode() === 'register'"
      [attr.aria-pressed]="mode() === 'register'"
      (click)="switchMode('register')"
    >
      Sign up
    </button>
  </div>

  @if (mode() === 'login') {
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <label>
        Email
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
          [attr.aria-describedby]="
            loginForm.controls.email.invalid && loginForm.controls.email.touched ? 'login-email-error' : null
          "
        />
        @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
          <span id="login-email-error" class="field-error">Enter a valid email address.</span>
        }
      </label>
      <label>
        Password
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
          [attr.aria-describedby]="
            loginForm.controls.password.invalid && loginForm.controls.password.touched
              ? 'login-password-error'
              : null
          "
        />
        @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
          <span id="login-password-error" class="field-error">Password is required.</span>
        }
      </label>
      <button type="submit" class="submit" [disabled]="submitting()">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>
  } @else {
    <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <label>
        Display name
        <input
          type="text"
          formControlName="displayName"
          autocomplete="name"
          [attr.aria-invalid]="registerForm.controls.displayName.invalid && registerForm.controls.displayName.touched"
          [attr.aria-describedby]="
            registerForm.controls.displayName.invalid && registerForm.controls.displayName.touched
              ? 'register-displayName-error'
              : null
          "
        />
        @if (registerForm.controls.displayName.invalid && registerForm.controls.displayName.touched) {
          <span id="register-displayName-error" class="field-error">Display name is required.</span>
        }
      </label>
      <label>
        Email
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="registerForm.controls.email.invalid && registerForm.controls.email.touched"
          [attr.aria-describedby]="
            registerForm.controls.email.invalid && registerForm.controls.email.touched
              ? 'register-email-error'
              : null
          "
        />
        @if (registerForm.controls.email.invalid && registerForm.controls.email.touched) {
          <span id="register-email-error" class="field-error">Enter a valid email address.</span>
        }
      </label>
      <label>
        Password
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="registerForm.controls.password.invalid && registerForm.controls.password.touched"
          [attr.aria-describedby]="
            registerForm.controls.password.invalid && registerForm.controls.password.touched
              ? 'register-password-error'
              : null
          "
        />
        @if (registerForm.controls.password.invalid && registerForm.controls.password.touched) {
          <span id="register-password-error" class="field-error">Password must be at least 8 characters.</span>
        }
      </label>
      <button type="submit" class="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>
  }

  <p class="divider">or continue with</p>
  <div class="oauth">
    <a href="/oauth2/authorization/google">Sign in with Google</a>
    <a href="/oauth2/authorization/github">Sign in with GitHub</a>
  </div>
</div>
</div>
