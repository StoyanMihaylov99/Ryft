<svg
  [attr.viewBox]="'0 0 ' + viewBoxWidth + ' ' + viewBoxHeight"
  class="burndown-svg"
  role="img"
  [attr.aria-label]="'Burndown chart for ' + burndown().sprintName"
>
  <line
    class="axis-line"
    [attr.x1]="margin.left"
    [attr.y1]="margin.top"
    [attr.x2]="margin.left"
    [attr.y2]="plotBottom"
  />
  <line
    class="axis-line"
    [attr.x1]="margin.left"
    [attr.y1]="plotBottom"
    [attr.x2]="viewBoxWidth - margin.right"
    [attr.y2]="plotBottom"
  />

  @for (tick of yTicks(); track tick.value) {
    <text class="axis-label" [attr.x]="margin.left - 8" [attr.y]="tick.y + 3" text-anchor="end">{{ tick.value }}</text>
  }

  @for (tick of xTicks(); track tick.date) {
    <text class="axis-label" [attr.x]="tick.x" [attr.y]="plotBottom + 20" text-anchor="middle">{{
      tick.date | date: 'MMM d'
    }}</text>
  }

  <polyline class="ideal-line" [attr.points]="idealPolylinePoints()" />

  @if (actualIsSinglePoint()) {
    @if (actualSinglePoint(); as point) {
      <circle class="actual-point" [attr.cx]="point.x" [attr.cy]="point.y" r="4" />
    }
  } @else if (actualPoints().length > 1) {
    <polyline class="actual-line" [attr.points]="actualPolylinePoints()" />
  }
</svg>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch ideal-swatch"></span>Ideal</span>
  <span class="legend-item"><span class="legend-swatch actual-swatch"></span>Actual</span>
</div>
