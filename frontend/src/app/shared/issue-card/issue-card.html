<span class="issue-card-header">
  <span class="issue-key">{{ issue().key }}</span>
  <app-issue-type-badge [type]="issue().type" />
</span>
<p class="issue-title">{{ issue().title }}</p>
<span class="issue-priority priority-{{ issue().priority.toLowerCase() }}">{{
  issue().priority
}}</span>
@if (issue().storyPoints != null) {
  <span class="issue-story-points-badge">{{ issue().storyPoints }} pts</span>
}
@if (epicTitle(); as title) {
  <span class="epic-chip" [title]="'Epic: ' + title">Epic: {{ title }}</span>
}
