services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ryft
      POSTGRES_USER: ryft
      POSTGRES_PASSWORD: ryft
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data:
