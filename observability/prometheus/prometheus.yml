global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ryft-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # The backend runs on the host (`mvn spring-boot:run`), not as a compose service — see
      # CLAUDE.md "How to run locally" — so Prometheus, itself inside a container, reaches it via
      # Docker's host-gateway alias rather than a service name. host.docker.internal works
      # out-of-the-box on Docker Desktop (macOS/Windows); the `extra_hosts` entry in
      # docker-compose.yml is what makes the same alias resolve on Linux too.
      - targets: ["host.docker.internal:8081"]
